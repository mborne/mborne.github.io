site_name: mborne.github.io
site_url: https://mborne.github.io/
repo_url: https://github.com/mborne/mborne.github.io
repo_name: mborne/mborne.github.io
edit_uri: edit/main/docs/
theme:
  name: material
  language: fr
  logo: assets/logo-qtw.svg
  custom_dir: overrides
  features:
    - content.action.edit
    - content.code.copy
    # fil d'Ariane (https://squidfunk.github.io/mkdocs-material/setup/setting-up-navigation/#navigation-path)
    - navigation.path
    # les pages index.md servent de page d'accueil de section
    - navigation.indexes
    # repli des sections non actives dans le sommaire
    - navigation.prune
    # bouton de retour en haut de page
    - navigation.top
    # mise à jour de l'URL en fonction de la section consultée
    - navigation.tracking
    - toc.follow
# https://www.mkdocs.org/user-guide/configuration/#validation
validation:
  nav:
    # toute page du site doit etre referencee dans "nav" ou "not_in_nav" (erreur avec "mkdocs build --strict")
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    # les ancres des liens internes doivent exister
    anchors: warn
not_in_nav: |
  # pages accessibles depuis le pied de page (overrides/partials/copyright.html)
  /mentions-legales/index.md
  /cookies/index.md
  # fiches outils accessibles depuis outils/index.md (fil d'Ariane via overrides/partials/path.html)
  /outils/
nav:
  - Accueil: index.md
  - Architecture:
      - architecture/index.md
      - API:
          - architecture/api/index.md
          - Bibliothèque, CLI et API WEB: architecture/api/approche-complete/index.md
      - Patrons de conception:
          - architecture/patrons-conception/index.md
          - Création:
              - architecture/patrons-conception/creation/index.md
              - Singleton: architecture/patrons-conception/creation/Singleton.md
              - Prototype: architecture/patrons-conception/creation/Prototype.md
              - Factory: architecture/patrons-conception/creation/Factory.md
              - Builder: architecture/patrons-conception/creation/Builder.md
              - Fluent Interface: architecture/patrons-conception/creation/FluentInterface.md
              - Fluent Builder: architecture/patrons-conception/creation/FluentBuilder.md
          - Structure:
              - architecture/patrons-conception/structure/index.md
              - Facade: architecture/patrons-conception/structure/Facade.md
              - Decorator: architecture/patrons-conception/structure/Decorator.md
              - Composite: architecture/patrons-conception/structure/Composite.md
              - Adapter: architecture/patrons-conception/structure/Adapter.md
              - Bridge: architecture/patrons-conception/structure/Bridge.md
          - Comportement:
              - architecture/patrons-conception/comportement/index.md
              - Iterator: architecture/patrons-conception/comportement/Iterator.md
              - Template Method: architecture/patrons-conception/comportement/TemplateMethod.md
              - Strategy: architecture/patrons-conception/comportement/Strategy.md
              - Visitor: architecture/patrons-conception/comportement/Visitor.md
              - Chain of Responsibility: architecture/patrons-conception/comportement/ChainOfResponsibility.md
              - Observer: architecture/patrons-conception/comportement/Observer.md
              - State: architecture/patrons-conception/comportement/State.md
              - Null Object: architecture/patrons-conception/comportement/NullObject.md
          - TP Geometry: architecture/patrons-conception/tp-geometry-ts/index.md
          - Architecturaux:
              - architecture/patrons-conception/architecturaux/index.md
              - Injection de dépendances: architecture/patrons-conception/architecturaux/InjectionDependances.md
              - Couches: architecture/patrons-conception/architecturaux/couches.md
              - MVC: architecture/patrons-conception/architecturaux/MVC.md
              - EDA: architecture/patrons-conception/architecturaux/EDA.md
              - MapReduce: architecture/patrons-conception/architecturaux/MapReduce.md
          - Cloud: architecture/patrons-conception/cloud/index.md
          - Spécificités des langages: architecture/patrons-conception/specificites-langages/index.md
          - Références: architecture/patrons-conception/references/index.md
          - Dépôts: architecture/patrons-conception/depots/index.md
      - Refactoring:
          - architecture/refactoring/index.md
          - TP Graph: architecture/refactoring/tp-graph-ts/index.md
      - Dépendances: architecture/dependances/index.md
  - DevOps:
      - devops/index.md
      - Origines: devops/origines/index.md
      - Principes: devops/principes/index.md
      - Infrastructure as Code:
          - devops/iac/index.md
          - Idempotence: devops/iac/idempotence/index.md
          - Cohabitation des automatismes: devops/iac/cohabitation/index.md
      - Livrables:
          - devops/livrables/index.md
          - Gestion sémantique de version: devops/livrables/semver/index.md
          - Stockage des livrables et des artefacts: devops/livrables/stockage-artefact/index.md
      - Virtualisation: devops/virtualisation/index.md
      - Conteneurs: devops/conteneurs/index.md
      - Réseaux:
          - devops/reseau/index.md
          - Protocoles:
              - devops/reseau/protocoles/index.md
              - Ethernet: devops/reseau/protocoles/ethernet/index.md
              - Résolution de nom de domaine (DNS): devops/reseau/protocoles/dns/index.md
          - Virtualisation des réseaux: devops/reseau/virtualisation/index.md
          - Flux entrants et sortants:
              - devops/reseau/flux/index.md
              - Partage de charge et reverse proxy: devops/reseau/flux/lb-rp/index.md
              - Proxy sortant:
                  - devops/reseau/flux/proxy-sortant/index.md
                  - Variables d'environnement: devops/reseau/flux/proxy-sortant/proxy-env-vars.md
                  - Cas de Docker: devops/reseau/flux/proxy-sortant/proxy-docker.md
          - Expérimentations:
              - devops/reseau/bricolage/index.md
              - Brancher un namespace sur un bridge: devops/reseau/bricolage/bridge-netns/README.md
              - Créer un bridge avec un DHCP / DNS conteneurisé: devops/reseau/bricolage/bridge-nspawn/README.md
              - Configurer une machine en routeur: devops/reseau/bricolage/vm-router/index.md
      - Cloud:
          - devops/cloud/index.md
          - 12 facteurs: devops/cloud/12-facteurs/index.md
  - DevSecOps:
      - devsecops/index.md
      - Sensibilisation:
          - devsecops/sensibilisation/index.md
          - Attaques SSH: devsecops/sensibilisation/attaque-ssh/index.md
          - Services exposés: devsecops/sensibilisation/exposition-internet/index.md
      - Abuser story: devsecops/abuser-story/index.md
      - Automatisation: devsecops/automatisation/index.md
  - Données géographiques: geodata/index.md
  - IA:
      - ia/index.md
      - Optimisation: ia/optimisation/index.md
      - LLM:
          - ia/llm/index.md
          - Principe de fonctionnement: ia/llm/principe/index.md
          - Concepts avancés: ia/llm/concepts/index.md
          - Techniques de rendu: ia/llm/rendu/index.md
          - Modèles locaux: ia/llm/modeles-locaux/index.md
          - Développement: ia/llm/developpement/index.md
          - OKF: ia/llm/okf/index.md
          - MCP:
              - ia/llm/mcp/index.md
              - MCP GitHub: ia/llm/mcp/mcp-github.md
          - Expérimentations: ia/llm/experimentations/index.md
  - Documentation:
      - documentation/index.md
      - Markdown: documentation/markdown/index.md
      - Docs as code:
          - documentation/docs-as-code/index.md
          - Usine logicielle: documentation/docs-as-code/usine-logicielle/index.md
          - Site statique: documentation/docs-as-code/site-statique/index.md
          - Contrôles en CI: documentation/docs-as-code/controles/index.md
      - Schémas: documentation/schemas/index.md
      - Générateurs de site: documentation/sites-web/index.md
      - Diaporamas: documentation/presentations/index.md
      - Enregistrement du terminal: documentation/terminal/index.md
  - Outils:
      - outils/index.md
  - Veille techno: veille/index.md
  - Historique: historique/index.md
plugins:
  - tags
  - privacy:
      assets_include:
        - stats.quadtreeworld.net/*
  - search
  - git-revision-date-localized:
      type: date
  - redirects:
      redirect_maps:
        devops/reseau/ethernet/index.md: devops/reseau/protocoles/ethernet/index.md
        devops/reseau/dns/index.md: devops/reseau/protocoles/dns/index.md
        ia/mcp/index.md: ia/llm/mcp/index.md
        ia/mcp/mcp-github.md: ia/llm/mcp/mcp-github.md
        devops/12-facteurs/index.md: devops/cloud/12-facteurs/index.md
        devops/devsecops/index.md: devsecops/index.md
        devops/semver/index.md: devops/livrables/semver/index.md
        devops/letsencrypt-acme/index.md: outils/letsencrypt/README.md
        devops/letsencrypt-acme/wildcard.md: outils/letsencrypt/wildcard/index.md
        devops/securite/index.md: devsecops/sensibilisation/attaque-ssh/index.md
        devops/securite/devsecops/index.md: devsecops/index.md
        devops/stockage-artefact/index.md: devops/livrables/stockage-artefact/index.md
        devops/lb-rp/index.md: devops/reseau/flux/lb-rp/index.md
        devops/proxy-sortant/index.md: devops/reseau/flux/proxy-sortant/index.md
        devops/proxy-sortant/proxy-env-vars.md: devops/reseau/flux/proxy-sortant/proxy-env-vars.md
        devops/proxy-sortant/proxy-docker.md: devops/reseau/flux/proxy-sortant/proxy-docker.md
  - exclude:
      glob:
        - outils/cxx/examples/*
        - outils/java/examples/*
        - outils/python/examples/*
        - outils/rust/basic-examples/*
        - outils/rust/wkt-generator/*
extra:
  # matomo integration
  analytics:
    # overrides/partials/integrations/analytics/custom.html
    provider: custom
    property: foobar
extra_javascript:
  - assets/js/main.js
extra_css:
  - assets/css/style.css
markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
      toc_depth: 2-4
  - tables
  - footnotes
  - pymdownx.superfences
  - pymdownx.details
  # texte barré avec ~~...~~ (https://squidfunk.github.io/mkdocs-material/reference/formatting/)
  - pymdownx.tilde
  - pymdownx.escapeall:
      hardbreak: true
  - pymdownx.tabbed:
      alternate_style: true
  # checkbox
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  # https://squidfunk.github.io/mkdocs-material/reference/grids/
  - attr_list
  - md_in_html
  # https://squidfunk.github.io/mkdocs-material/reference/icons-emojis/
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji 
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # https://squidfunk.github.io/mkdocs-material/reference/diagrams/
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format