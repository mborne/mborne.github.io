site_name: mborne.github.io
site_url: https://mborne.github.io/
repo_url: https://github.com/mborne/mborne.github.io
repo_name: mborne/mborne.github.io
edit_uri: edit/main/docs/
theme:
  name: material
  language: fr
  logo: assets/logo-qtw.svg
  custom_dir: overrides
  features:
    - content.action.edit
    - content.code.copy
    # fil d'Ariane (https://squidfunk.github.io/mkdocs-material/setup/setting-up-navigation/#navigation-path)
    - navigation.path
    # les pages index.md servent de page d'accueil de section
    - navigation.indexes
    # repli des sections non actives dans le sommaire
    - navigation.prune
    # bouton de retour en haut de page
    - navigation.top
    # mise à jour de l'URL en fonction de la section consultée
    - navigation.tracking
    - toc.follow
# https://www.mkdocs.org/user-guide/configuration/#validation
validation:
  nav:
    # toute page du site doit etre referencee dans "nav" (erreur avec "mkdocs build --strict")
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    # les ancres des liens internes doivent exister
    anchors: warn
nav:
  - Accueil: index.md
  - Architecture:
      - architecture/index.md
      - API:
          - architecture/api/index.md
          - Bibliothèque, CLI et API WEB: architecture/api/approche-complete/index.md
      - Patrons de conception: architecture/patrons-conception/index.md
  - DevOps:
      - devops/index.md
      - Origines: devops/origines/index.md
      - Principes: devops/principes/index.md
      - Infrastructure as Code:
          - devops/iac/index.md
          - Idempotence: devops/iac/idempotence/index.md
          - Cohabitation des automatismes: devops/iac/cohabitation/index.md
      - Livrables:
          - devops/livrables/index.md
          - Gestion sémantique de version: devops/livrables/semver/index.md
          - Stockage des livrables et des artefacts: devops/livrables/stockage-artefact/index.md
      - Virtualisation: devops/virtualisation/index.md
      - Conteneurs: devops/conteneurs/index.md
      - Réseaux:
          - devops/reseau/index.md
          - Protocoles:
              - devops/reseau/protocoles/index.md
              - Ethernet: devops/reseau/protocoles/ethernet/index.md
              - Résolution de nom de domaine (DNS): devops/reseau/protocoles/dns/index.md
          - Virtualisation des réseaux: devops/reseau/virtualisation/index.md
          - Flux entrants et sortants:
              - devops/reseau/flux/index.md
              - Partage de charge et reverse proxy: devops/reseau/flux/lb-rp/index.md
              - Proxy sortant:
                  - devops/reseau/flux/proxy-sortant/index.md
                  - Variables d'environnement: devops/reseau/flux/proxy-sortant/proxy-env-vars.md
                  - Cas de Docker: devops/reseau/flux/proxy-sortant/proxy-docker.md
          - Expérimentations:
              - devops/reseau/bricolage/index.md
              - Brancher un namespace sur un bridge: devops/reseau/bricolage/bridge-netns/README.md
              - Créer un bridge avec un DHCP / DNS conteneurisé: devops/reseau/bricolage/bridge-nspawn/README.md
              - Configurer une machine en routeur: devops/reseau/bricolage/vm-router/index.md
      - Cloud:
          - devops/cloud/index.md
          - 12 facteurs: devops/cloud/12-facteurs/index.md
  - DevSecOps:
      - devsecops/index.md
      - Sensibilisation:
          - devsecops/sensibilisation/index.md
          - Attaques SSH: devsecops/sensibilisation/attaque-ssh/index.md
          - Services exposés: devsecops/sensibilisation/exposition-internet/index.md
      - Abuser story: devsecops/abuser-story/index.md
      - Automatisation: devsecops/automatisation/index.md
  - Données géographiques: geodata/index.md
  - IA:
      - ia/index.md
      - LLM: ia/llm/index.md
      - MCP (Model Context Protocol):
          - ia/mcp/index.md
          - MCP GitHub - de l'issue à la revue de code: ia/mcp/mcp-github.md
  - Documentation: documentation/index.md
  - Outils:
      - outils/index.md
  - Veille techno: veille/index.md
  - Historique: historique/index.md
  - Mentions légales: mentions-legales/index.md
  - Cookies et statistiques: cookies/index.md
plugins:
  - tags
  - privacy:
      assets_include:
        - stats.quadtreeworld.net/*
  - search
  - git-revision-date-localized:
      type: date
  - redirects:
      redirect_maps:
        devops/reseau/ethernet/index.md: devops/reseau/protocoles/ethernet/index.md
        devops/reseau/dns/index.md: devops/reseau/protocoles/dns/index.md
        devops/12-facteurs/index.md: devops/cloud/12-facteurs/index.md
        devops/securite/index.md: devsecops/sensibilisation/attaque-ssh/index.md
        devops/securite/devsecops/index.md: devsecops/index.md
        devops/stockage-artefact/index.md: devops/livrables/stockage-artefact/index.md
        devops/lb-rp/index.md: devops/reseau/flux/lb-rp/index.md
        devops/proxy-sortant/index.md: devops/reseau/flux/proxy-sortant/index.md
        devops/proxy-sortant/proxy-env-vars.md: devops/reseau/flux/proxy-sortant/proxy-env-vars.md
        devops/proxy-sortant/proxy-docker.md: devops/reseau/flux/proxy-sortant/proxy-docker.md
  - exclude:
      glob:
        - outils/cxx/examples/*
        - outils/java/examples/*
        - outils/python/examples/*
        - outils/rust/basic-examples/*
        - outils/rust/wkt-generator/*
extra:
  # matomo integration
  analytics:
    # overrides/partials/integrations/analytics/custom.html
    provider: custom
    property: foobar
extra_javascript:
  - assets/js/main.js
extra_css:
  - assets/css/style.css
markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
      toc_depth: 2-4
  - tables
  - footnotes
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.escapeall:
      hardbreak: true
  - pymdownx.tabbed:
      alternate_style: true
  # checkbox
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
  # https://squidfunk.github.io/mkdocs-material/reference/grids/
  - attr_list
  - md_in_html
  # https://squidfunk.github.io/mkdocs-material/reference/icons-emojis/
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji 
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # https://squidfunk.github.io/mkdocs-material/reference/diagrams/
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format